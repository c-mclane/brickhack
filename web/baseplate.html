<!doctype html>
<html><head><meta charset="utf-8"><title>BrickHack scene</title>
<style>
html,body{margin:0;height:100%;background:#8fb8de;overflow:hidden;font:13px system-ui,sans-serif}
#status{position:fixed;left:10px;bottom:10px;padding:4px 9px;border-radius:6px;background:#0008;color:#fff;transition:background .3s}
#status.flash{background:#2a8f3a}
.tag{position:fixed;transform:translate(-50%,0);color:#fff;font:12px monospace;text-shadow:1px 1px 0 #000,-1px -1px 0 #000;white-space:nowrap;pointer-events:none}
#music{position:fixed;right:10px;bottom:10px;padding:5px 11px;border:0;border-radius:6px;background:#0008;color:#fff;font:inherit;cursor:pointer}
#music:hover{background:#000a}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="status">connecting...</div>
<button id="music">&#9834; play music</button>
<script type="module">
// Live view of web/assets/brick/scene.built.json: polls it every second and
// rebuilds the scene whenever it changes, keeping the camera where it is.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { isMist, mistify, quantumPart, strobify, addAura, addLightning, addEffects, addHueShift, addBlink } from './js/mist.js';
import { FigureAnimator, figureJoints, poseJoints, setHinge, ATTACK_TIME } from './js/minifig-anim.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { gradientEnvironment } from './js/envmap.js';
import { BallChain, ankleAnchor } from './js/ballchain.js';
import { BoulderFX } from './js/boulderfx.js';
import { MODEL_SCALE } from './js/brick.js';

const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(innerWidth, innerHeight); r.setPixelRatio(devicePixelRatio);
r.shadowMap.enabled = true;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fb8de);
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 500);
const ctl = new OrbitControls(cam, r.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(12, 28, 18); sun.castShadow = true;
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, far: 120 });   // covers a tall shelf
scene.add(sun);
// display-case fill: a soft shadowless light from the viewer's side, so shelves don't hide what's on them
const fill = new THREE.DirectionalLight(0xfff4e6, 1.3);
fill.position.set(0, 12, 20); scene.add(fill);

const env = gradientEnvironment(THREE, r); // what metal reflects (envmap.js; plastic is lit as ever)
const loader = new GLTFLoader();
const models = new Map();   // url -> Promise<Object3D>
function model(url) {
  if (!models.has(url)) models.set(url, new Promise((res, rej) => loader.load(url, g => {
    g.scene.traverse(o => {
      if (!o.isMesh) return;
      o.material.flatShading = true; o.castShadow = o.receiveShadow = true;
      if (o.material.metalness > 0.5) { o.material.envMap = env; o.material.envMapIntensity = 1.2; } // chrome: reflects
      // a doppelganger's other half is shimmering mist
      if (isMist(o.material)) { mistify(o); return; }
      if (quantumPart(o.material) !== null) strobify(o);
      // translucent brick (flames, ice) glows, as in the game
      if (o.material.transparent && o.material.map) o.castShadow = false; // (printed see-through plastic: solid ink, its own alpha)
      else if (o.material.transparent) {
        // translucent plastic glows in its colour; clear plastic is glass: barely glowing, more see-through
        const c = o.material.color, clear = c.r > 0.8 && c.g > 0.8 && c.b > 0.8;
        o.material.emissive = c.clone(); o.material.emissiveIntensity = clear ? 0.12 : 0.7; o.material.opacity = clear ? 0.4 : 0.78; o.castShadow = false;
      }
    });
    addAura(THREE, g.scene); // an angel's glow
    addLightning(THREE, g.scene); // Mjollnir's crackle
    addEffects(THREE, g.scene); // an artifact's element: fire, meteors, frost
    addHueShift(THREE, g.scene); // a magic marker's shifting colour
    addBlink(THREE, g.scene); // a land mine's blinking light
    res(g.scene);
  }, undefined, rej)));
  return models.get(url);
}

const root = new THREE.Group(); scene.add(root);
// the figures come alive (minifig-anim.js): each breathes and looks about;
// W: everyone walks (on the spot), Space: everyone attacks, R: stretch again,
// 1-9: hold everyone's slash at 10%-90% of the way through (to look at it), 0: let go
let animated = [], walking = false, freeze = null, hinged = [], chained = [], pushers = [], breakers = [];
const status = document.getElementById('status');
let version = null, camKey = null;

// NetHack's own sprites (assets/slashem/tiles.png), laid flat beside their
// brick versions: the sheet with its key colour made see-through
const TILE_KEY = [71, 108, 108];
let tileSheet = null;
function tiles() {
  if (!tileSheet) tileSheet = Promise.all([
    fetch('assets/slashem/tiles.json').then(r => r.json()),
    new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = 'assets/slashem/tiles.png'; }),
  ]).then(([meta, im]) => {
    const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
    const g = c.getContext('2d'); g.drawImage(im, 0, 0);
    const d = g.getImageData(0, 0, c.width, c.height);
    for (let i = 0; i < d.data.length; i += 4)
      if (d.data[i] === TILE_KEY[0] && d.data[i + 1] === TILE_KEY[1] && d.data[i + 2] === TILE_KEY[2]) d.data[i + 3] = 0;
    g.putImageData(d, 0, 0);
    const tex = new THREE.CanvasTexture(c);
    tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; tex.colorSpace = THREE.SRGBColorSpace;
    return { meta, tex };
  });
  return tileSheet;
}
async function tileMesh(i) {
  const { meta, tex } = await tiles();
  const geo = new THREE.PlaneGeometry(3, 3); // (3 studs: most of a map square)
  const cols = meta.cols, rows = meta.rows, u0 = (i % cols) / cols, v1 = 1 - Math.floor(i / cols) / rows;
  const u1 = u0 + 1 / cols, v0 = v1 - 1 / rows;
  geo.setAttribute('uv', new THREE.Float32BufferAttribute([u0, v1, u1, v1, u0, v0, u1, v0], 2));
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.5 }));
  m.rotation.x = -Math.PI / 2; // lying on the ground
  return m;
}
// labels under things, kept over them on screen
let tags = [];
function placeTags() {
  const v = new THREE.Vector3();
  for (const t of tags) {
    v.copy(t.at).project(cam);
    const show = v.z < 1;
    t.el.style.display = show ? '' : 'none';
    if (show) { t.el.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; t.el.style.top = ((1 - v.y) / 2 * innerHeight) + 'px'; }
  }
}

// a chained figure's walk: round its circle (angle th), facing the way it goes
function walkTo(c, th) {
  c.th = th;
  c.m.position.set(c.centre.x + c.R * Math.cos(th), c.centre.y, c.centre.z + c.R * Math.sin(th));
  c.m.rotation.y = Math.atan2(-Math.sin(th), Math.cos(th));
}
// a pusher's loop, by the clock: stand behind the boulder; step into its square (it rolls on into the
// next); again; swing the pick three times (the third breaks it: grit, and rocks, four of which stay); rest
const FIG_Y = 72 / 80; // (its shoulders over its feet, in squares)
const PUSH_AT = [0.8, 2.6], SWING_AT = [4.4, 5.2, 6.0], LOOP = 10;
function runPusher(p, now, dt) {
  if (p.t0 === null) p.t0 = now;
  let t = now - p.t0;
  if (t >= LOOP) { p.t0 = now; t = 0; }
  if (t < p.last || p.last === undefined) { // (a new loop: the boulder back where it was, the rocks gone)
    p.fx.clear();
    p.sq = 0;
    p.b = p.fx.place(p.boulder, 1, 0);
  }
  for (const [k, at] of PUSH_AT.entries()) if (p.last < at && t >= at) { p.fx.push(p.b, 2 + k, 0); p.walk = { from: p.sq, at }; }
  for (const [k, at] of SWING_AT.entries()) if (p.last < at && t >= at) {
    p.a.attack();
    if (k === SWING_AT.length - 1) setTimeout(() => { if (p.halves) p.fx.crack(p.b, p.halves, p.rock, 4, true); else p.fx.shatter(p.b, p.rock, 4, null, true); p.b = null; }, ATTACK_TIME * 450);
  }
  p.last = t;
  // walking a square behind the boulder: 0.6 s a step
  let moving = false;
  if (p.walk) {
    const u = (t - p.walk.at) / 0.6;
    if (u >= 1 || u < 0) { p.sq = p.walk.from + 1; p.walk = null; } else { p.sq = p.walk.from + u; moving = true; }
  }
  p.m.position.set(p.sq + 0.5, FIG_Y, 0.5);
  poseJoints(p.j, p.a.update(dt, { moving }));
  p.fx.step();
}
// a statue breaking, over and over: standing a moment, then it shudders, the figure crumbles and its
// bricks blow apart (boulderfx.js crumble); they lie where they fell a while; and it stands again
const BREAK_AT = 1.5, BREAK_LOOP = 7.5;
function runBreaker(s, now) {
  if (s.t0 === null) s.t0 = now;
  let t = now - s.t0;
  if (t >= BREAK_LOOP) { s.t0 = now; t = 0; }
  if (t < s.last || s.last === undefined) { s.fx.clear(); s.m.visible = true; }
  if (s.last < BREAK_AT && t >= BREAK_AT) {
    s.m.visible = false;
    s.fx.crumble(s.pieces.map((pc) => ({ model: pc.model, pos: pc.pos, q: pc.q, fig: pc.fig })), new THREE.Vector3(0, 0.05, 0), true); // (as in the game: gone once at rest)
  }
  s.last = t;
  s.fx.step();
}
async function apply(data) {
  for (const t of tags) t.el.remove();
  tags = [];
  const objs = await Promise.all(data.objects.map(async o => {
    if (o.tile != null) {
      const m = await tileMesh(o.tile);
      m.position.set(o.pos[0] / 20, -o.pos[1] / 20 + 0.01, -o.pos[2] / 20);
      return m;
    }
    let tag = null;
    if (o.label) {
      const el = document.createElement('div'); el.className = 'tag'; el.textContent = o.label; document.body.appendChild(el);
      // (an item's at its feet, toward you; a figure's over its head, once it's loaded: below)
      tag = { el, at: new THREE.Vector3(o.pos[0] / 20, 0.3, -o.pos[2] / 20 + 0.75) };
      tags.push(tag);
    }
    const m = (await model(o.url)).clone();
    // LDraw units -> studs, LDraw's -Y up -> +Y up (the .glb itself is already converted)
    m.position.set(o.pos[0] / 20, -o.pos[1] / 20, -o.pos[2] / 20);
    m.rotation.y = (o.rotY || 0) * Math.PI / 180;
    if (tag && /\/fig_/.test(o.url || '')) { // (a figure's name just over the top of its head, however tall it stands)
      m.updateMatrixWorld(true);
      tag.at.set(m.position.x, new THREE.Box3().setFromObject(m).max.y + 0.5, m.position.z);
    }
    return m;
  }));
  root.clear(); objs.forEach(m => root.add(m));
  // punished: a figure walking a circle, its ball and chain dragging after it (ballchain.js)
  for (const c of chained) c.bc.dispose();
  chained = [];
  await Promise.all(data.objects.map(async (o, i) => {
    if (!o.chain) return;
    const m = objs[i], j = figureJoints(m);
    if (!j) return;
    const [link, ball] = await Promise.all([model(o.chain.link), model(o.chain.ball)]);
    const a = new FigureAnimator(j.rig, { phase: 0.3 }); a.spawn();
    const centre = m.position.clone(), R = o.chain.path;
    const c = { m, j, a, centre, R, th: 0 };
    walkTo(c, 0);
    poseJoints(j, a.update(0, { moving: true }));
    c.bc = new BallChain({ link, ball, anchor: ankleAnchor(j.joints, root), parent: root, links: o.chain.links, floor: 0.2, dir: new THREE.Vector3(1, 0, 0) });
    chained.push(c);
  }));
  // a boulder pushed and broken (boulderfx.js): in squares, as the game has it (a square: 4 studs)
  for (const p of pushers) root.remove(p.world);
  pushers = [];
  await Promise.all(data.objects.map(async (o, i) => {
    if (!o.boulders) return;
    const m = objs[i], j = figureJoints(m);
    if (!j) return;
    const [boulder, rock, halves] = await Promise.all([model(o.boulders.boulder), model(o.boulders.rock),
      o.boulders.halves ? Promise.all(o.boulders.halves.map(model)) : null]);
    const world = new THREE.Group();
    world.scale.setScalar(1 / MODEL_SCALE);
    world.position.set(m.position.x, 0, m.position.z);
    root.add(world);
    root.remove(m); world.add(m);
    m.scale.setScalar(MODEL_SCALE);
    m.rotation.y = Math.PI / 2; // (facing +x: the way it pushes)
    m.position.set(0.5, FIG_Y, 0.5); // (standing behind the boulder, from the first frame)
    const a = new FigureAnimator(j.rig, { phase: 0.5 }); a.spawn();
    pushers.push({ m, j, a, world, fx: new BoulderFX(world), boulder, rock, halves, t0: null, step: -1 });
  }));
  // an item that breaks brick by brick (boulderfx.js crumble): in squares, as the game has it
  for (const s of breakers) root.remove(s.world);
  breakers = [];
  await Promise.all(data.objects.map(async (o, i) => {
    if (!o.shatters) return;
    const m = objs[i], models = await Promise.all(o.shatters.map((b) => model(b.url)));
    const world = new THREE.Group();
    world.scale.setScalar(1 / MODEL_SCALE);
    world.position.set(m.position.x, 0, m.position.z);
    root.add(world);
    // each brick where it is in the whole (its model's units: studs), the whole standing where it's drawn
    const off = new THREE.Vector3(0, -m.position.y, 0);
    const base = (o.shatters.find((b) => /part-35394-/.test(b.url)) || { pos: [0, 0, 0] }).pos[1];
    const pieces = o.shatters.map((b, k) => {
      const M = new THREE.Matrix4().setFromMatrix3(new THREE.Matrix3().set(...b.mat));
      return { model: models[k], pos: new THREE.Vector3(...b.pos).sub(off).multiplyScalar(MODEL_SCALE),
        q: new THREE.Quaternion().setFromRotationMatrix(M), fig: b.pos[1] > base + 0.1 };
    });
    breakers.push({ m, world, fx: new BoulderFX(world), pieces, t0: null });
  }));
  hinged = objs.filter((m) => setHinge(THREE, m, 0) !== false); // (a chest: its lid swings on a loop)
  animated = objs.map((m, i) => { if (data.objects[i].chain || data.objects[i].boulders) return null; const j = figureJoints(m); if (!j) return null; const a = new FigureAnimator(j.rig, { phase: i * 0.77 }); a.spawn(); return { j, a }; }).filter(Boolean);
  const ck = JSON.stringify(data.camera);
  if (data.camera && ck !== camKey) {
    cam.position.set(...data.camera.pos); ctl.target.set(...data.camera.target);
  }
  camKey = ck;
}

async function poll() {
  try {
    const data = await (await fetch('assets/brick/scene.built.json', { cache: 'no-store' })).json();
    if (data.level) { // the test dungeon (testbed.js): the game's own renderer, a scripted hero
      if (version === null) {
        version = data.version;
        r.domElement.style.display = 'none'; btn.style.display = 'none'; document.body.style.background = '#0b0d14';
        status.textContent = 'test dungeon · drag to look, wheel to zoom, P to pause';
        (await import('./js/testbed.js')).runTestbed(data);
      } else if (data.version !== version) location.reload();
      setTimeout(poll, 1000);
      return;
    }
    if (data.version !== version) {
      const first = version === null;
      version = data.version;
      await apply(data);
      status.textContent = `live · ${data.objects.length} objects · updated ${new Date().toLocaleTimeString()}`;
      if (!first) { status.classList.add('flash'); setTimeout(() => status.classList.remove('flash'), 800); }
    }
  } catch (e) { status.textContent = 'waiting for scene... (' + e.message + ')'; }
  setTimeout(poll, 1000);
}
poll();

// Music: loops one tracker module through libopenmpt (vendor/chiptune3).
// Starts only from its button (browsers need a click before any audio anyway).
const TRACK = 'music/AGAiN/AGAiN - Cirond Winc kg.xm';
const btn = document.getElementById('music');
let player = null, playing = false;
async function startMusic() {
  if (player) return;
  const { ChiptuneJsPlayer } = await import('./vendor/chiptune3/chiptune3.js');
  player = new ChiptuneJsPlayer({ repeatCount: -1 });
  player.onInitialized(() => {
    player.setVol(0.6);
    player.load(TRACK.split('/').map(encodeURIComponent).join('/'));
    playing = true;
  });
  player.onMetadata(m => { btn.textContent = '\u266A ' + 'AGAiN \u2014 Cirond Winc kg' + ' \u2014 click to pause'; });
  player.onError(e => { btn.textContent = '\u266A music error'; console.error(e); });
}
btn.addEventListener('pointerdown', e => {   // pointerdown, so the page's own first-press listener doesn't also fire
  e.stopPropagation();
  if (!player) return startMusic();
  player.togglePause(); playing = !playing;
  btn.textContent = btn.textContent.replace(/click to (pause|play)$/, playing ? 'click to pause' : 'click to play');
});

addEventListener('keydown', e => {
  if (e.key === 'w' || e.key === 'W') walking = !walking;
  if (e.key === ' ') { animated.forEach(x => x.a.attack()); e.preventDefault(); }
  if (e.key === 'r' || e.key === 'R') animated.forEach(x => x.a.spawn());
  if (/^[0-9]$/.test(e.key)) freeze = e.key === '0' ? null : +e.key / 10;
});
let last = performance.now();
(function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, ((now || last) - last) / 1000); last = now || last;
  for (const x of animated) {
    if (freeze != null) x.a.attackT0 = x.a.t - freeze * ATTACK_TIME;
    poseJoints(x.j, x.a.update(dt, { moving: walking }));
  }
  // the punished walk on a while, stop a while (so the ball comes to rest), and walk on
  for (const c of chained) {
    const k = ((now || last) / 1000) % 7, moving = k < 5;
    if (moving) walkTo(c, c.th + dt * 1.4 / c.R);
    poseJoints(c.j, c.a.update(dt, { moving }));
    c.bc.step(dt);
  }
  // the boulder: pushed a square, pushed again, then hacked at till it breaks; and again
  for (const p of pushers) runPusher(p, (now || last) / 1000, dt);
  for (const s of breakers) runBreaker(s, (now || last) / 1000);
  // hinged parts: open, a pause, shut, a pause (as a chest is looted in the game)
  const k = ((now || last) / 1000) % 4, u = k < 1 ? k : k < 2 ? 1 : k < 3 ? 3 - k : 0, e = u * u * (3 - 2 * u);
  for (const m of hinged) { const max = setHinge(THREE, m, 0); setHinge(THREE, m, -max * e); }
  ctl.update(); r.render(scene, cam); placeTags();
})();
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight); });
</script></body></html>
